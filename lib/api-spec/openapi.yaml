        yoyPct:
          type: number
          nullable: true
        yoyPctWithM2:
          type: number
          nullable: true
        roc13wAnnPct:
          type: number
          nullable: true
          description: Latest 13-week annualized rate of change (%)
        roc26wAnnPct:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/GliStatus"
        statusLabel:
          type: string
        statusBlurb:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/GliComponent"
        history:
          type: array
          description: Weekly GLI level in USD trillions
          items:
            $ref: "#/components/schemas/GliPoint"
        normalizedHistory:
          type: array
          description: Weekly GLI rebased to 100 at the anchor date (Jan 2014)
          items:
