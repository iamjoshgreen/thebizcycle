openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Cycle Chart API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chart
    description: Chart data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chart:
    get:
      operationId: getChart
      tags: [chart]
      summary: Get chart data
      description: Returns composite, SPX, recessions, overlays, and lastUpdated timestamp
      responses:
        "200":
          description: Chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /refresh:
    post:
      operationId: refreshChart
      tags: [chart]
      summary: Force refresh chart data
      description: Re-fetches from Yahoo and FRED, recomputes everything, returns new chart payload
      responses:
        "200":
          description: Refreshed chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /housing:
    get:
      operationId: getHousing
      tags: [housing]
      summary: Get housing domino payload
      description: Returns the residential construction cycle dominoes, stage, and Fed status
      responses:
        "200":
          description: Housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"

  /housing/refresh:
    post:
      operationId: refreshHousing
      tags: [housing]
      summary: Force refresh housing data
      responses:
        "200":
          description: Refreshed housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DataPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix timestamp in seconds (Friday close)
        value:
          type: number
      required:
        - time
        - value

    RecessionInterval:
      type: object
      properties:
        start:
          type: number
          description: Unix timestamp in seconds
        end:
          type: number
          description: Unix timestamp in seconds
      required:
        - start
        - end

    ChartPayload:
      type: object
      properties:
        composite:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        spx:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        recessions:
          type: array
          items:
            $ref: "#/components/schemas/RecessionInterval"
        overlays:
          $ref: "#/components/schemas/Overlays"
        lastUpdated:
          type: number
          description: Unix timestamp in seconds when cache was populated
      required:
        - composite
        - spx
        - recessions
        - overlays
        - lastUpdated

    Overlays:
      type: object
      properties:
        oil:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        unrate:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        fedfunds:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        dgs10:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        t10y2y:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        btc:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        cpi:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
      required:
        - oil
        - unrate
        - fedfunds
        - dgs10
        - t10y2y
        - btc
        - cpi

    MonthlyPoint:
      type: object
      properties:
        time:
          type: number
        value:
          type: number
      required: [time, value]

    DominoStatus:
      type: object
      properties:
        id:
          type: string
          enum: [newSales, permits, underConstruction, employment, homePrices]
        label:
          type: string
        series:
          type: string
        current:
          type: number
          nullable: true
        currentDate:
          type: number
          nullable: true
        peakValue:
          type: number
          nullable: true
        peakDate:
          type: number
          nullable: true
        pctOffPeak:
          type: number
          nullable: true
        monthsSincePeak:
          type: number
          nullable: true
        roc3m:
          type: number
          nullable: true
        roc6m:
          type: number
          nullable: true
        state:
          type: string
          enum: [expanding, rolling_over, fallen]
        fallen:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required:
        - id
        - label
        - series
        - current
        - currentDate
        - peakValue
        - peakDate
        - pctOffPeak
        - monthsSincePeak
        - roc3m
        - roc6m
        - state
        - fallen
        - data

    FedStatus:
      type: object
      properties:
        current:
          type: number
          nullable: true
        yearAgo:
          type: number
          nullable: true
        tightening:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required: [current, yearAgo, tightening, data]

    HousingPayload:
      type: object
      properties:
        fed:
          $ref: "#/components/schemas/FedStatus"
        dominoes:
          type: array
          items:
            $ref: "#/components/schemas/DominoStatus"
        stage:
          type: number
        stageLabel:
          type: string
        expectedTimingMonths:
          type: array
          nullable: true
          items:
            type: number
        expectedTimingNote:
          type: string
          nullable: true
        sequenceValid:
          type: boolean
        sequenceNote:
          type: string
        lastUpdated:
          type: number
      required:
        - fed
        - dominoes
        - stage
        - stageLabel
        - expectedTimingMonths
        - expectedTimingNote
        - sequenceValid
        - sequenceNote
        - lastUpdated
