    BtcQuantilePoint:
      type: object
      description: One time point in the BTC quantile band series. price is null for projection points beyond the last historical observation. The seven q* values are deterministic Table 3 quantiles, rearranged (sorted ascending) per date.
      properties:
        time:
          type: number
          description: Unix seconds (Friday weekly grid)
        price:
          type: number
          nullable: true
          description: Actual BTC-USD close price; null for projection points
        q01:
          type: number
          description: 1% quantile price (10^(c+a·x+b·x²)), rearranged
        q10:
          type: number
          description: 10% quantile price, rearranged
        q25:
          type: number
          description: 25% quantile price, rearranged
        q50:
          type: number
          description: 50% (median) quantile price, rearranged
        q75:
          type: number
          description: 75% quantile price, rearranged
        q95:
          type: number
          description: 95% quantile price, rearranged
        q99:
          type: number
          description: 99% quantile price, rearranged
        disl1:
          type: number
          description: Dislocation line 1, q01 × (1 − 0.0735)
        disl2:
          type: number
          description: Dislocation line 2, q01 × (1 − 0.174)
        disl3:
          type: number
          description: Dislocation line 3, q01 × (1 − 0.226)
        disl4:
          type: number
          description: Dislocation line 4, q01 × (1 − 0.346)
      required:
        [time, price, q01, q10, q25, q50, q75, q95, q99, disl1, disl2, disl3, disl4]

    BtcCyclePeak:
      type: object
      description: A historical Bitcoin cycle peak and its position relative to the quantile bands.
      properties:
        time:
          type: number
          description: Unix seconds of the peak
        price:
          type: number
          description: Actual BTC price at the peak
        label:
          type: string
          description: Human-readable label e.g. "2021"
        q99:
          type: number
          description: Q99% band value at the time of the peak
        pctOfQ99:
          type: number
          description: price / q99 — fraction of the top quantile the peak reached (diminishing across cycles)
      required: [time, price, label, q99, pctOfQ99]

    BtcQuantilePayload:
      type: object
      properties:
        series:
          type: array
          description: Weekly series of price + band values, historical then 2-year projection
          items:
            $ref: "#/components/schemas/BtcQuantilePoint"
        cyclePeaks:
          type: array
          description: Known cycle peaks with their band context
          items:
            $ref: "#/components/schemas/BtcCyclePeak"
        currentPrice:
          type: number
          nullable: true
          description: Latest BTC-USD weekly close
        currentQ01:
          type: number
          nullable: true
          description: 1% quantile at the latest data point
        currentQ10:
          type: number
          nullable: true
          description: 10% quantile at the latest data point
        currentQ50:
          type: number
          nullable: true
          description: 50% (median) quantile at the latest data point
        currentQ95:
          type: number
          nullable: true
          description: 95% quantile at the latest data point
        currentQ99:
          type: number
          nullable: true
          description: 99% quantile at the latest data point
        currentPercentile:
          type: number
          nullable: true
          description: Interpolated percentile of current price across the 7 taus, 0-100
        goldenTop:
          type: number
          nullable: true
          description: Golden zone upper bound (disl1) at the latest data point
        goldenBottom:
          type: number
          nullable: true
          description: Golden zone lower bound (disl4) at the latest data point
        modelNote:
          type: string
          description: Plain-English description of the model, its assumptions, and its limits
        lastUpdated:
          type: number
          description: Unix seconds when this data was last refreshed
      required:
        - series
        - cyclePeaks
        - currentPrice
        - currentQ01
        - currentQ10
        - currentQ50
        - currentQ95
        - currentQ99
        - currentPercentile
        - goldenTop
        - goldenBottom
        - modelNote
        - lastUpdated

    RateShockStatus:
      type: string
      enum: [calm, warning, shock, insufficient]

    RateShockPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix seconds, last trading day of the week (UTC)
        value:
          type: number
      required: [time, value]

    RateShockEpisode:
      type: object
      properties:
        startTime:
          type: number
          description: Unix seconds, first day the 3-month rise crossed the shock threshold
        peakTime:
          type: number
          description: Unix seconds, day of the largest 3-month rise within the episode
        peakChangeBp:
          type: number
        fromYield:
          type: number
          description: 10Y yield 63 trading days before the peak, in %
        toYield:
          type: number
          description: 10Y yield at the peak, in %
        active:
          type: boolean
          description: True if the episode is still running as of the latest print
        context:
          type: string
          nullable: true
          description: What happened during or shortly after the episode. Null when nothing clearly broke.
      required:
        - startTime
        - peakTime
        - peakChangeBp
        - fromYield
        - toYield
        - active
        - context

    RateShockTrigger:
      type: object
      properties:
        tradingDaysAhead:
          type: number
        approxDate:
          type: number
          description: Unix seconds — latest date plus N weekdays (ignores holidays)
        baseTime:
          type: number
          description: Unix seconds — the date that becomes the 3-month-ago base on that day
        baseYield:
          type: number
        triggerYield:
          type: number
          description: 10Y level needed on that day for a +100bp 3-month rise, in %
      required:
        - tradingDaysAhead
        - approxDate
        - baseTime
        - baseYield
        - triggerYield

    RateShockPayload:
      type: object
      properties:
        latestTime:
          type: number
          nullable: true
        latestYield:
          type: number
          nullable: true
        baseTime:
          type: number
          nullable: true
          description: Unix seconds, 63 trading days before latestTime
        baseYield:
          type: number
          nullable: true
        change1dBp:
          type: number
          nullable: true
        change5dBp:
          type: number
          nullable: true
        change21dBp:
          type: number
          nullable: true
        change63dBp:
          type: number
          nullable: true
          description: Headline — 10Y change over 63 trading days (~3 months), in basis points
        windowTradingDays:
          type: number
        warnThresholdBp:
          type: number
        shockThresholdBp:
          type: number
        status:
          $ref: "#/components/schemas/RateShockStatus"
        statusLabel:
          type: string
        translation:
          type: string
        blurb:
          type: string
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/RateShockTrigger"
        history:
          type: array
          description: Weekly 3-month change in bp since 1962
          items:
            $ref: "#/components/schemas/RateShockPoint"
        yieldHistory:
          type: array
          description: Weekly 10Y yield level in % since 1962
          items:
            $ref: "#/components/schemas/RateShockPoint"
        episodes:
          type: array
          items:
            $ref: "#/components/schemas/RateShockEpisode"
        nberRecessions:
          type: array
          items:
            $ref: "#/components/schemas/NberRecessionInterval"
        partialData:
          type: boolean
        notes:
          type: array
          items:
            type: string
        lastUpdated:
          type: number
          description: Unix seconds when this data was last refreshed
      required:
        - latestTime
        - latestYield
        - baseTime
        - baseYield
        - change1dBp
        - change5dBp
        - change21dBp
        - change63dBp
        - windowTradingDays
        - warnThresholdBp
        - shockThresholdBp
        - status
        - statusLabel
        - translation
        - blurb
        - triggers
        - history
        - yieldHistory
        - episodes
        - nberRecessions
        - partialData
        - notes
        - lastUpdated
