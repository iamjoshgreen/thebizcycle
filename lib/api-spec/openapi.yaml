openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Cycle Chart API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chart
    description: Chart data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chart:
    get:
      operationId: getChart
      tags: [chart]
      summary: Get chart data
      description: Returns composite, SPX, recessions, overlays, and lastUpdated timestamp
      responses:
        "200":
          description: Chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /refresh:
    post:
      operationId: refreshChart
      tags: [chart]
      summary: Force refresh chart data
      description: Re-fetches from Yahoo and FRED, recomputes everything, returns new chart payload
      responses:
        "200":
          description: Refreshed chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /housing:
    get:
      operationId: getHousing
      tags: [housing]
      summary: Get housing domino payload
      description: Returns the residential construction cycle dominoes, stage, and Fed status
      responses:
        "200":
          description: Housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"

  /housing/refresh:
    post:
      operationId: refreshHousing
      tags: [housing]
      summary: Force refresh housing data
      responses:
        "200":
          description: Refreshed housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"

  /recession:
    get:
      operationId: getRecession
      tags: [recession]
      summary: Get recession indicator payload
      description: Returns CJI, per-sector stats, historical CJI, NBER recession periods, and PAYEMS YoY context series
      responses:
        "200":
          description: Recession payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecessionPayload"

  /recession/refresh:
    post:
      operationId: refreshRecession
      tags: [recession]
      summary: Force refresh recession data
      responses:
        "200":
          description: Refreshed recession payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecessionPayload"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DataPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix timestamp in seconds (Friday close)
        value:
          type: number
      required:
        - time
        - value

    RecessionInterval:
      type: object
      properties:
        start:
          type: number
          description: Unix timestamp in seconds
        end:
          type: number
          description: Unix timestamp in seconds
      required:
        - start
        - end

    ChartPayload:
      type: object
      properties:
        composite:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        spx:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        recessions:
          type: array
          items:
            $ref: "#/components/schemas/RecessionInterval"
        overlays:
          $ref: "#/components/schemas/Overlays"
        lastUpdated:
          type: number
          description: Unix timestamp in seconds when cache was populated
      required:
        - composite
        - spx
        - recessions
        - overlays
        - lastUpdated

    Overlays:
      type: object
      properties:
        oil:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        unrate:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        fedfunds:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        dgs10:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        t10y2y:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        btc:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        cpi:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
      required:
        - oil
        - unrate
        - fedfunds
        - dgs10
        - t10y2y
        - btc
        - cpi

    MonthlyPoint:
      type: object
      properties:
        time:
          type: number
        value:
          type: number
      required: [time, value]

    DominoStatus:
      type: object
      properties:
        id:
          type: string
          enum: [newSales, permits, underConstruction, employment, homePrices]
        label:
          type: string
        series:
          type: string
        current:
          type: number
          nullable: true
        currentDate:
          type: number
          nullable: true
        peakValue:
          type: number
          nullable: true
        peakDate:
          type: number
          nullable: true
        pctOffPeak:
          type: number
          nullable: true
        monthsSincePeak:
          type: number
          nullable: true
        roc3m:
          type: number
          nullable: true
        roc6m:
          type: number
          nullable: true
        state:
          type: string
          enum: [expanding, rolling_over, fallen]
        fallen:
          type: boolean
        orderStatus:
          type: string
          # "healthy" = still expanding, no order judgement.
          # "in_order" = declining and every earlier domino started declining at
          #              least as long ago.
          # "out_of_order" = declining but some predecessor is still healthy or
          #                  started declining more recently than this one.
          # "pending" = legacy; retained so older clients still parse cleanly.
          enum: [in_order, out_of_order, healthy, pending]
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required:
        - id
        - label
        - series
        - current
        - currentDate
        - peakValue
        - peakDate
        - pctOffPeak
        - monthsSincePeak
        - roc3m
        - roc6m
        - state
        - fallen
        - orderStatus
        - data

    FedStatus:
      type: object
      properties:
        current:
          type: number
          nullable: true
        yearAgo:
          type: number
          nullable: true
        tightening:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required: [current, yearAgo, tightening, data]

    HousingPayload:
      type: object
      properties:
        fed:
          $ref: "#/components/schemas/FedStatus"
        dominoes:
          type: array
          items:
            $ref: "#/components/schemas/DominoStatus"
        stage:
          type: number
        stageLabel:
          type: string
        expectedTimingMonths:
          type: array
          nullable: true
          items:
            type: number
        expectedTimingNote:
          type: string
          nullable: true
        sequenceValid:
          type: boolean
        sequenceNote:
          type: string
        headlineLabel:
          type: string
        headlineSubtitle:
          type: string
        summary:
          type: string
        fedContext:
          type: string
        lastUpdated:
          type: number
      required:
        - fed
        - dominoes
        - stage
        - stageLabel
        - expectedTimingMonths
        - expectedTimingNote
        - sequenceValid
        - sequenceNote
        - headlineLabel
        - headlineSubtitle
        - summary
        - fedContext
        - lastUpdated

    SectorStats:
      type: object
      properties:
        id:
          type: string
          enum:
            - residentialConstruction
            - durableGoods
            - totalConstruction
            - totalManufacturing
        label:
          type: string
        series:
          type: string
        role:
          type: string
          enum: [leader, confirmation]
        current:
          type: number
          nullable: true
        currentDate:
          type: number
          nullable: true
        peakValue:
          type: number
          nullable: true
        peakDate:
          type: number
          nullable: true
        pctOffPeak:
          type: number
          nullable: true
        monthsSincePeak:
          type: number
          nullable: true
        yoyPct:
          type: number
          nullable: true
        ann3mPct:
          type: number
          nullable: true
        status:
          type: string
          enum: [expansion, warning, signal, insufficient]
      required:
        - id
        - label
        - series
        - role
        - current
        - currentDate
        - peakValue
        - peakDate
        - pctOffPeak
        - monthsSincePeak
        - yoyPct
        - ann3mPct
        - status

    NberRecessionInterval:
      type: object
      properties:
        start:
          type: number
        end:
          type: number
      required: [start, end]

    RecessionPayload:
      type: object
      properties:
        cji:
          type: number
          nullable: true
        cjiStatus:
          type: string
          enum: [expansion, warning, signal, insufficient]
        cjiLabel:
          type: string
        cjiBlurb:
          type: string
        cjiTranslation:
          type: string
        sectorSummary:
          type: string
        confirmationStatus:
          type: string
        confirmedRed:
          type: boolean
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorStats"
        cjiHistory:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        nberRecessions:
          type: array
          items:
            $ref: "#/components/schemas/NberRecessionInterval"
        payemsYoY:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        dataAsOf:
          type: number
          nullable: true
        lastFredDate:
          type: number
          nullable: true
        partialData:
          type: boolean
        notes:
          type: array
          items:
            type: string
        lastUpdated:
          type: number
      required:
        - cji
        - cjiStatus
        - cjiLabel
        - cjiBlurb
        - cjiTranslation
        - sectorSummary
        - confirmationStatus
        - confirmedRed
        - sectors
        - cjiHistory
        - nberRecessions
        - payemsYoY
        - dataAsOf
        - lastFredDate
        - partialData
        - notes
        - lastUpdated
