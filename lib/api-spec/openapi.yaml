openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Cycle Chart API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chart
    description: Chart data operations
  - name: settings
    description: Per-page user settings persistence
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chart:
    get:
      operationId: getChart
      tags: [chart]
      summary: Get chart data from the database
      description: Pure database SELECT. Returns 404 if no row has ever been written for this indicator.
      responses:
        "200":
          description: Chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"
        "404":
          description: No data has been saved for this indicator yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataError"

  /refresh:
    post:
      operationId: refreshChart
      tags: [chart]
      summary: Force refresh chart data
      description: Re-fetches from Yahoo and FRED, recomputes everything, returns new chart payload
      responses:
        "200":
          description: Refreshed chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /housing:
    get:
      operationId: getHousing
      tags: [housing]
      summary: Get housing domino payload from the database
      description: Pure database SELECT. Returns 404 if no row has ever been written for this indicator.
      responses:
        "200":
          description: Housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"
        "404":
          description: No data has been saved for this indicator yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataError"

  /housing/refresh:
    post:
      operationId: refreshHousing
      tags: [housing]
      summary: Force refresh housing data
      responses:
        "200":
          description: Refreshed housing payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HousingPayload"

  /recession:
    get:
      operationId: getRecession
      tags: [recession]
      summary: Get recession indicator payload from the database
      description: Pure database SELECT. Returns 404 if no row has ever been written for this indicator.
      responses:
        "200":
          description: Recession payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecessionPayload"
        "404":
          description: No data has been saved for this indicator yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataError"

  /recession/refresh:
    post:
      operationId: refreshRecession
      tags: [recession]
      summary: Force refresh recession data
      responses:
        "200":
          description: Refreshed recession payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecessionPayload"

  /cyclical:
    get:
      operationId: getCyclical
      tags: [cyclical]
      summary: Get cyclical GDP indicator payload from the database
      description: Pure database SELECT. Returns 404 if no row has ever been written for this indicator.
      responses:
        "200":
          description: Cyclical GDP payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CyclicalPayload"
        "404":
          description: No data has been saved for this indicator yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataError"

  /settings/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getSetting
      tags: [settings]
      summary: Get a stored settings blob by key
      responses:
        "200":
          description: Settings payload (value is null when nothing has ever been saved for this key)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"
    put:
      operationId: putSetting
      tags: [settings]
      summary: Save a settings blob by key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsWriteBody"
      responses:
        "200":
          description: Updated settings payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsPayload"

  /cyclical/refresh:
    post:
      operationId: refreshCyclical
      tags: [cyclical]
      summary: Force refresh cyclical GDP data
      responses:
        "200":
          description: Refreshed cyclical GDP payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CyclicalPayload"

  /gli:
    get:
      operationId: getGli
      tags: [gli]
      summary: Get Global Liquidity Index payload from the database
      description: Pure database SELECT. Returns 404 if no row has ever been written for this indicator.
      responses:
        "200":
          description: GLI payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GliPayload"
        "404":
          description: No data has been saved for this indicator yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoDataError"

  /gli/refresh:
    post:
      operationId: refreshGli
      tags: [gli]
      summary: Force refresh Global Liquidity Index data
      responses:
        "200":
          description: Refreshed GLI payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GliPayload"

components:
  schemas:
    NoDataError:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SettingsPayload:
      type: object
      properties:
        value:
          type: object
          nullable: true
          additionalProperties: true
          description: Free-form settings JSON object, or null if nothing has been saved yet
        updatedAt:
          type: number
          description: Unix timestamp in seconds, 0 when no value has been saved
      required:
        - value
        - updatedAt

    SettingsWriteBody:
      type: object
      properties:
        value:
          type: object
          additionalProperties: true
          description: Free-form settings JSON object to save
      required:
        - value

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DataPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix timestamp in seconds (Friday close)
        value:
          type: number
      required:
        - time
        - value

    RecessionInterval:
      type: object
      properties:
        start:
          type: number
          description: Unix timestamp in seconds
        end:
          type: number
          description: Unix timestamp in seconds
      required:
        - start
        - end

    ChartPayload:
      type: object
      properties:
        composite:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        spx:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        spxM2:
          type: array
          description: SPX divided by M2 money supply (WM2NS), used for the dot-com fractal overlay.
          items:
            $ref: "#/components/schemas/DataPoint"
        recessions:
          type: array
          items:
            $ref: "#/components/schemas/RecessionInterval"
        overlays:
          $ref: "#/components/schemas/Overlays"
        lastUpdated:
          type: number
          description: Unix timestamp in seconds when this row was last refreshed and stored in the database
      required:
        - composite
        - spx
        - spxM2
        - recessions
        - overlays
        - lastUpdated

    Overlays:
      type: object
      properties:
        oil:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        unrate:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        fedfunds:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        dgs10:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        t10y2y:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        btc:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        cpi:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
      required:
        - oil
        - unrate
        - fedfunds
        - dgs10
        - t10y2y
        - btc
        - cpi

    MonthlyPoint:
      type: object
      properties:
        time:
          type: number
        value:
          type: number
      required: [time, value]

    DominoStatus:
      type: object
      properties:
        id:
          type: string
          enum: [newSales, permits, underConstruction, employment, homePrices]
        label:
          type: string
        series:
          type: string
        current:
          type: number
          nullable: true
        currentDate:
          type: number
          nullable: true
        peakValue:
          type: number
          nullable: true
        peakDate:
          type: number
          nullable: true
        pctOffPeak:
          type: number
          nullable: true
        monthsSincePeak:
          type: number
          nullable: true
        roc3m:
          type: number
          nullable: true
        roc6m:
          type: number
          nullable: true
        state:
          type: string
          enum: [expanding, rolling_over, fallen]
        fallen:
          type: boolean
        orderStatus:
          type: string
          # "healthy" = still expanding, no order judgement.
          # "in_order" = declining and every earlier domino started declining at
          #              least as long ago.
          # "out_of_order" = declining but some predecessor is still healthy or
          #                  started declining more recently than this one.
          # "pending" = legacy; retained so older clients still parse cleanly.
          enum: [in_order, out_of_order, healthy, pending]
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required:
        - id
        - label
        - series
        - current
        - currentDate
        - peakValue
        - peakDate
        - pctOffPeak
        - monthsSincePeak
        - roc3m
        - roc6m
        - state
        - fallen
        - orderStatus
        - data

    FedStatus:
      type: object
      properties:
        current:
          type: number
          nullable: true
        yearAgo:
          type: number
          nullable: true
        tightening:
          type: boolean
        data:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required: [current, yearAgo, tightening, data]

    CompletedMonthsSupply:
      type: object
      description: |
        Refinement of the standard "months supply of new homes" indicator that
        weights for completion mix. In 2022, raw months supply gave a false
        recession signal because <10% of inventory was completed (vs. 20-30%
        historically). Completed Months Supply = MSACSR * (completed/total).
      properties:
        currentMonthsSupply:
          type: number
          nullable: true
          description: Latest raw MSACSR value (months of supply).
        currentCompletedMonthsSupply:
          type: number
          nullable: true
          description: Latest MSACSR weighted by % of inventory marked completed.
        currentPctCompleted:
          type: number
          nullable: true
          description: Most recent % of new home inventory marked "completed".
        gap:
          type: number
          nullable: true
          description: currentMonthsSupply minus currentCompletedMonthsSupply.
        asOf:
          type: number
          nullable: true
          description: Unix seconds for the latest data point.
        signal:
          type: string
          enum: [tight, normal, elevated, recessionary, insufficient]
          description: Bucket for completed-months-supply current reading.
        headline:
          type: string
          description: One-line plain-English read of the current state.
        explainer:
          type: string
          description: Two-sentence context tying the metric to today's reading.
        monthsSupplyHistory:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        completedMonthsSupplyHistory:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        pctCompletedHistory:
          type: array
          description: Monthly history of % of new-home inventory marked completed (0-100).
          items:
            $ref: "#/components/schemas/MonthlyPoint"
      required:
        - currentMonthsSupply
        - currentCompletedMonthsSupply
        - currentPctCompleted
        - gap
        - asOf
        - signal
        - headline
        - explainer
        - monthsSupplyHistory
        - completedMonthsSupplyHistory
        - pctCompletedHistory

    HousingPayload:
      type: object
      properties:
        fed:
          $ref: "#/components/schemas/FedStatus"
        dominoes:
          type: array
          items:
            $ref: "#/components/schemas/DominoStatus"
        stage:
          type: number
        stageLabel:
          type: string
        expectedTimingMonths:
          type: array
          nullable: true
          items:
            type: number
        expectedTimingNote:
          type: string
          nullable: true
        sequenceValid:
          type: boolean
        sequenceNote:
          type: string
        headlineLabel:
          type: string
        headlineSubtitle:
          type: string
        summary:
          type: string
        fedContext:
          type: string
        completedMonthsSupply:
          $ref: "#/components/schemas/CompletedMonthsSupply"
        lastUpdated:
          type: number
      required:
        - fed
        - dominoes
        - stage
        - stageLabel
        - expectedTimingMonths
        - expectedTimingNote
        - sequenceValid
        - sequenceNote
        - headlineLabel
        - headlineSubtitle
        - summary
        - fedContext
        - lastUpdated

    SectorStats:
      type: object
      properties:
        id:
          type: string
          enum:
            - residentialConstruction
            - durableGoods
            - totalConstruction
            - totalManufacturing
        label:
          type: string
        series:
          type: string
        role:
          type: string
          enum: [leader, confirmation]
        current:
          type: number
          nullable: true
        currentDate:
          type: number
          nullable: true
        peakValue:
          type: number
          nullable: true
        peakDate:
          type: number
          nullable: true
        pctOffPeak:
          type: number
          nullable: true
        monthsSincePeak:
          type: number
          nullable: true
        yoyPct:
          type: number
          nullable: true
        ann3mPct:
          type: number
          nullable: true
        status:
          type: string
          enum: [expansion, warning, signal, insufficient]
      required:
        - id
        - label
        - series
        - role
        - current
        - currentDate
        - peakValue
        - peakDate
        - pctOffPeak
        - monthsSincePeak
        - yoyPct
        - ann3mPct
        - status

    NberRecessionInterval:
      type: object
      properties:
        start:
          type: number
        end:
          type: number
      required: [start, end]

    RecessionPayload:
      type: object
      properties:
        cji:
          type: number
          nullable: true
        cjiStatus:
          type: string
          enum: [expansion, warning, signal, insufficient]
        cjiLabel:
          type: string
        cjiBlurb:
          type: string
        cjiTranslation:
          type: string
        sectorSummary:
          type: string
        confirmationStatus:
          type: string
        confirmedRed:
          type: boolean
        sectors:
          type: array
          items:
            $ref: "#/components/schemas/SectorStats"
        cjiHistory:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        nberRecessions:
          type: array
          items:
            $ref: "#/components/schemas/NberRecessionInterval"
        payemsYoY:
          type: array
          items:
            $ref: "#/components/schemas/MonthlyPoint"
        dataAsOf:
          type: number
          nullable: true
        lastFredDate:
          type: number
          nullable: true
        partialData:
          type: boolean
        notes:
          type: array
          items:
            type: string
        lastUpdated:
          type: number
      required:
        - cji
        - cjiStatus
        - cjiLabel
        - cjiBlurb
        - cjiTranslation
        - sectorSummary
        - confirmationStatus
        - confirmedRed
        - sectors
        - cjiHistory
        - nberRecessions
        - payemsYoY
        - dataAsOf
        - lastFredDate
        - partialData
        - notes
        - lastUpdated

    CyclicalComponentId:
      type: string
      enum:
        - durableGoods
        - residentialInvestment
        - businessEquipment

    CyclicalComponent:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/CyclicalComponentId"
        label:
          type: string
        series:
          type: string
        latestLevel:
          type: number
          nullable: true
          description: Latest level in billions of chained 2017 dollars (SAAR)
        qoqAnnPct:
          type: number
          nullable: true
          description: Latest quarter-over-quarter annualized growth (%)
        yoyPct:
          type: number
          nullable: true
          description: Year-over-year growth (%)
        shareOfGdpPct:
          type: number
          nullable: true
          description: Latest level as a share of Real GDP (%)
        contractionPctSince1956:
          type: number
          nullable: true
          description: Share of quarters this component contracted (QoQ ann < 0) since 1956
      required:
        - id
        - label
        - series
        - latestLevel
        - qoqAnnPct
        - yoyPct
        - shareOfGdpPct
        - contractionPctSince1956

    CyclicalGrowthPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix seconds, first day of quarter UTC
        value:
          type: number
          description: QoQ annualized growth in %
      required: [time, value]

    CyclicalContractionStats:
      type: object
      properties:
        cyclicalPct:
          type: number
          nullable: true
          description: Share of quarters cyclical GDP contracted since 1956 (%)
        totalGdpPct:
          type: number
          nullable: true
          description: Share of quarters Real GDP contracted since 1956 (%)
        nonCyclicalPct:
          type: number
          nullable: true
          description: Share of quarters non-cyclical GDP contracted since 1956 (%)
        sinceYear:
          type: number
          description: First year included in the contraction-frequency stats
        quartersCounted:
          type: number
      required:
        - cyclicalPct
        - totalGdpPct
        - nonCyclicalPct
        - sinceYear
        - quartersCounted

    CyclicalStatus:
      type: string
      enum: [strong, expansion, decelerating, contraction, insufficient]

    CyclicalPayload:
      type: object
      properties:
        latestQuarter:
          type: number
          nullable: true
          description: Unix seconds, first day of latest quarter UTC
        latestQuarterLabel:
          type: string
          description: Human label like "2026 Q1"
        latestQoqAnnPct:
          type: number
          nullable: true
          description: Latest QoQ annualized growth of cyclical GDP (%)
        latestYoyPct:
          type: number
          nullable: true
        status:
          $ref: "#/components/schemas/CyclicalStatus"
        statusLabel:
          type: string
        statusBlurb:
          type: string
        recentSequence:
          type: array
          description: Most recent up to 4 quarters of cyclical QoQ ann growth, oldest first
          items:
            type: object
            properties:
              time:
                type: number
              quarterLabel:
                type: string
              value:
                type: number
                nullable: true
            required: [time, quarterLabel, value]
        components:
          type: array
          items:
            $ref: "#/components/schemas/CyclicalComponent"
        cyclicalSharePct:
          type: number
          nullable: true
          description: Cyclical GDP as share of Real GDP, latest quarter (%)
        cyclicalGrowthHistory:
          type: array
          description: QoQ annualized growth of cyclical GDP, all quarters available
          items:
            $ref: "#/components/schemas/CyclicalGrowthPoint"
        totalGdpGrowthHistory:
          type: array
          items:
            $ref: "#/components/schemas/CyclicalGrowthPoint"
        nonCyclicalGrowthHistory:
          type: array
          items:
            $ref: "#/components/schemas/CyclicalGrowthPoint"
        cyclicalMa4History:
          type: array
          description: 4-quarter trailing average of cyclical QoQ ann growth
          items:
            $ref: "#/components/schemas/CyclicalGrowthPoint"
        nberRecessions:
          type: array
          items:
            $ref: "#/components/schemas/NberRecessionInterval"
        contractionStats:
          $ref: "#/components/schemas/CyclicalContractionStats"
        partialData:
          type: boolean
        notes:
          type: array
          items:
            type: string
        lastUpdated:
          type: number
      required:
        - latestQuarter
        - latestQuarterLabel
        - latestQoqAnnPct
        - latestYoyPct
        - status
        - statusLabel
        - statusBlurb
        - recentSequence
        - components
        - cyclicalSharePct
        - cyclicalGrowthHistory
        - totalGdpGrowthHistory
        - nonCyclicalGrowthHistory
        - cyclicalMa4History
        - nberRecessions
        - contractionStats
        - partialData
        - notes
        - lastUpdated

    CyclicalQuarterEntry:
      type: object
      description: One quarter entry in recentSequence; defined here so Zod can be regenerated cleanly.
      properties:
        time:
          type: number
        quarterLabel:
          type: string
        value:
          type: number
          nullable: true
      required: [time, quarterLabel, value]
