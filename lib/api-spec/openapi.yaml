openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Business Cycle Chart API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chart
    description: Chart data operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /chart:
    get:
      operationId: getChart
      tags: [chart]
      summary: Get chart data
      description: Returns composite, SPX, recessions, overlays, and lastUpdated timestamp
      responses:
        "200":
          description: Chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

  /refresh:
    post:
      operationId: refreshChart
      tags: [chart]
      summary: Force refresh chart data
      description: Re-fetches from Yahoo and FRED, recomputes everything, returns new chart payload
      responses:
        "200":
          description: Refreshed chart payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartPayload"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    DataPoint:
      type: object
      properties:
        time:
          type: number
          description: Unix timestamp in seconds (Friday close)
        value:
          type: number
      required:
        - time
        - value

    RecessionInterval:
      type: object
      properties:
        start:
          type: number
          description: Unix timestamp in seconds
        end:
          type: number
          description: Unix timestamp in seconds
      required:
        - start
        - end

    ChartPayload:
      type: object
      properties:
        composite:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        spx:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        recessions:
          type: array
          items:
            $ref: "#/components/schemas/RecessionInterval"
        overlays:
          $ref: "#/components/schemas/Overlays"
        lastUpdated:
          type: number
          description: Unix timestamp in seconds when cache was populated
      required:
        - composite
        - spx
        - recessions
        - overlays
        - lastUpdated

    Overlays:
      type: object
      properties:
        oil:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        unrate:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        fedfunds:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        dgs10:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        t10y2y:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
        btc:
          type: array
          items:
            $ref: "#/components/schemas/DataPoint"
      required:
        - oil
        - unrate
        - fedfunds
        - dgs10
        - t10y2y
        - btc
